<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1115" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="부업 수익" />
  <title>부업 수익</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <header class="top">
      <button id="settingsBtn" class="icon-btn" title="연결 설정">⚙️</button>
    </header>

    <!-- 핵심: 얼마 벌었는지 -->
    <section class="hero">
      <div class="hero-label" id="heroLabel">이번 달 번 돈</div>
      <div class="hero-amount" id="grandTotal">₩0</div>
    </section>

    <div class="range-tabs" id="rangeTabs">
      <button data-range="today">오늘</button>
      <button data-range="yesterday">어제</button>
      <button data-range="last7">7일</button>
      <button data-range="month" class="active">이번 달</button>
    </div>

    <!-- 광고별 합계 -->
    <section class="split">
      <div class="split-row">
        <span class="split-name"><i class="dot adsense"></i>애드센스</span>
        <span class="split-amt" id="adsenseTotal">₩0</span>
      </div>
      <div class="split-row">
        <span class="split-name"><i class="dot adpost"></i>애드포스트</span>
        <span class="split-amt" id="adpostTotal">₩0</span>
      </div>
    </section>

    <section id="alerts"></section>

    <!-- 채널별 (이름 + 금액만) -->
    <section id="channels" class="channels"></section>

    <p class="empty-hint" id="emptyHint" hidden>
      아직 수익이 없어요.<br />아래 버튼으로 추가하거나 ⚙️에서 연결하세요.
    </p>

    <button id="addManualBtn" class="add-btn">＋ 수익 추가</button>
  </main>

  <!-- 설정 모달 -->
  <div class="modal" id="settingsModal" hidden>
    <div class="modal-card">
      <div class="modal-head">
        <h2>연결 설정</h2>
        <button class="icon-btn" data-close>✕</button>
      </div>
      <div class="conn-block">
        <div class="conn-title"><span class="dot adsense"></span> 구글 애드센스</div>
        <p class="conn-desc">공식 API로 수익을 자동으로 가져옵니다.</p>
        <div id="adsenseConn"></div>
      </div>
      <div class="conn-block">
        <div class="conn-title"><span class="dot adpost"></span> 네이버 애드포스트</div>
        <p class="conn-desc">
          공식 API가 없어 로그인 쿠키로 가져옵니다.
          <a href="#" id="cookieHelp">쿠키 얻는 법</a>
        </p>
        <div id="adpostConn"></div>
        <div id="cookieHelpBox" class="help-box" hidden>
          1. PC 크롬에서 <b>adpost.naver.com</b> 로그인<br />
          2. F12 → Application → Cookies → naver.com<br />
          3. 쿠키 문자열 전체 복사 → 아래에 붙여넣기<br />
          <small>※ 쿠키는 이 서버에만 저장되고 외부로 안 나갑니다.</small>
        </div>
      </div>
    </div>
  </div>

  <!-- 수익 추가 모달 (최소 입력) -->
  <div class="modal" id="manualModal" hidden>
    <div class="modal-card">
      <div class="modal-head">
        <h2>수익 추가</h2>
        <button class="icon-btn" data-close>✕</button>
      </div>
      <form id="manualForm" class="manual-form">
        <div class="seg" id="provSeg">
          <button type="button" data-prov="adpost" class="active">애드포스트</button>
          <button type="button" data-prov="adsense">애드센스</button>
        </div>
        <input type="hidden" name="provider" value="adpost" />
        <label>수익금 (₩)
          <input name="revenue" type="number" inputmode="numeric" placeholder="15542" required autofocus />
        </label>
        <label>이름 <span class="opt">(선택)</span>
          <input name="name" placeholder="예: 내 블로그" />
        </label>
        <div class="grid3">
          <label>조회 <span class="opt">(선택)</span><input name="views" type="number" inputmode="numeric" placeholder="0" /></label>
          <label>방문 <span class="opt">(선택)</span><input name="visits" type="number" inputmode="numeric" placeholder="0" /></label>
          <label>노출 <span class="opt">(선택)</span><input name="impressions" type="number" inputmode="numeric" placeholder="0" /></label>
        </div>
        <button type="submit" class="primary-btn big">추가하기</button>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
